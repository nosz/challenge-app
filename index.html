    });
    if (fontInput) fontInput.addEventListener('change', () => persist());

    const langInput = overlay.querySelector('#settings-lang');
    if (langInput) langInput.addEventListener('change', (e) => {
      state.settings.lang = e.target.value;
      ensureCompletionMessagesForLang(state.settings.lang);
      persist();
      render();
      showSettingsPanel();
    });

    overlay.querySelectorAll('.theme-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        const key = sw.getAttribute('data-theme');
        if (key === 'custom') {
          const wasClosed = !(customThemeEditorOpen && state.settings.themeKey === 'custom');
          if (!state.settings.customTheme) {
            // Erststart: eigenes Theme mit den Werten des zuletzt aktiven
            // Themes vorbefüllen, statt bei Null anzufangen.
            const base = themeBase(state.settings.themeKey, state.settings);
            state.settings.customTheme = { ink: base.ink, gold: base.gold, sage: base.sage, rust: base.rust };
          }
          if (wasClosed) {
            // Editor wird frisch geöffnet -> Dropdown-Anzeige zurücksetzen,
            // damit dort nicht mehr eine längst vergangene Auswahl steht.
            customThemeBaseSelection = null;
          }
          state.settings.themeKey = 'custom';
          customThemeEditorOpen = wasClosed ? true : !customThemeEditorOpen;
          persist();
          applyTheme('custom', state.settings);
          showSettingsPanel();
          return;
        }
        state.settings.themeKey = key;
        customThemeEditorOpen = false;
        persist();
        applyTheme(key, state.settings);
        showSettingsPanel();
      });
    });

    const customBaseSelect = overlay.querySelector('#s-custom-base');
    if (customBaseSelect) customBaseSelect.addEventListener('change', (e) => {
      const key = e.target.value;
      if (!key) return;
      const src = themeBase(key, state.settings);
      state.settings.customTheme = { ink: src.ink, gold: src.gold, sage: src.sage, rust: src.rust };
      state.settings.themeKey = 'custom';
      customThemeBaseSelection = key;
      persist();
      applyTheme('custom', state.settings);
      showSettingsPanel();
    });

    function refreshCustomSwatchPreview() {
      const previewEl = overlay.querySelector('.theme-swatch-custom .preview');
      if (!previewEl) return;
      const base = getCustomBase(state.settings);
      const blocks = [base.ink, base.surface, base.gold, base.sage, base.rust];
      previewEl.querySelectorAll('.swatch-block').forEach((block, i) => { block.style.background = blocks[i]; });
    }

    CUSTOM_THEME_FIELDS.forEach(field => {
      const input = overlay.querySelector('#s-custom-' + field);
      if (!input) return;
      // 'input' feuert live während der Auswahl im nativen Farbwähler ->
      // sofortige Vorschau in der ganzen App, ohne das Panel komplett neu zu
      // zeichnen (das würde den Picker auf manchen Geräten unterbrechen).
      input.addEventListener('input', (e) => {
        if (!state.settings.customTheme) state.settings.customTheme = { ...getCustomBase(state.settings) };
        state.settings.customTheme[field] = e.target.value;
        state.settings.themeKey = 'custom';
        applyTheme('custom', state.settings);
        refreshCustomSwatchPreview();
      });
      input.addEventListener('change', () => persist());
    });

    const customBookmarkSaveBtn = overlay.querySelector('#s-custom-bookmark-save');
    if (customBookmarkSaveBtn) customBookmarkSaveBtn.addEventListener('click', () => {
      // Merkt die aktuellen 4 Farben explizit als "meine gute Farbe" — getrennt
      // von den laufend automatisch gespeicherten Live-Werten. Nur so lässt
      // sich später gezielt zu genau diesem Stand zurückkehren, auch wenn
      // zwischenzeitlich weiter herumprobiert wurde.
      state.settings.customThemeSaved = { ...state.settings.customTheme };
      persist();
      showSettingsPanel();
    });

    const customBookmarkRestoreBtn = overlay.querySelector('#s-custom-bookmark-restore');
    if (customBookmarkRestoreBtn) customBookmarkRestoreBtn.addEventListener('click', () => {
      if (!state.settings.customThemeSaved) return;
      state.settings.customTheme = { ...state.settings.customThemeSaved };
      state.settings.themeKey = 'custom';
      customThemeBaseSelection = null;
      persist();
      applyTheme('custom', state.settings);
      showSettingsPanel();
    });

    const customResetBtn = overlay.querySelector('#s-custom-reset');
    if (customResetBtn) customResetBtn.addEventListener('click', () => {
      // Klappt nur den Editor ein. themeKey bleibt 'custom' — die Kachel
      // "Eigene Farben" bleibt also weiterhin als aktives Theme ausgewählt.
      // Wer ein anderes Theme möchte, tippt direkt auf dessen Kachel.
      customThemeEditorOpen = false;
      showSettingsPanel();
    });

    const addQuoteDayBtn = overlay.querySelector('#add-quote-day-btn');
    if (addQuoteDayBtn) addQuoteDayBtn.addEventListener('click', () => {
      const ta = overlay.querySelector('#new-quote-day');
      const val = ta.value.trim();
      if (!val) return;
      ensureQuotesForLang(state.settings.lang);
      const newQuote = { id: uid(), text: val, isDefault: false };
      state.quotesByLang[state.settings.lang].unshift(newQuote);
      // Wie beim Bearbeiten: auch eine ganz neu erstellte Meldung muss beim
      // nächsten Tagesabschluss garantiert als erste Meldung erscheinen,
      // danach greift wieder das normale Zufallsprinzip (siehe pickRandomQuote()).
      state.settings.forcedDayQuoteId = newQuote.id;
      persist();
      showSettingsPanel();
    });

    overlay.querySelectorAll('.quote-item [data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        state.quotesByLang[state.settings.lang] = state.quotesByLang[state.settings.lang].filter(q => q.id !== id);
        persist();
        showSettingsPanel();
      });
    });

    overlay.querySelectorAll('.quote-item [data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const q = state.quotesByLang[state.settings.lang].find(x => x.id === id);
        if (!q) return;
        const itemDiv = overlay.querySelector(`.quote-item[data-quote-id="${id}"]`);
        const viewDiv = itemDiv.querySelector('[data-view]');
        viewDiv.innerHTML = `
          <textarea class="quote-edit-textarea" rows="6">${escapeHtml(q.text)}</textarea>
          <div class="quote-edit-actions">
            <button type="button" class="btn-primary" data-save="${id}">${t('quotes_save_btn')}</button>
            <button type="button" class="btn-secondary" data-cancel="${id}">${t('quotes_close_btn')}</button>
          </div>
        `;
        const ta = viewDiv.querySelector('textarea');
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
        viewDiv.querySelector('[data-save]').addEventListener('click', () => {
          const newVal = viewDiv.querySelector('textarea').value.trim();
          // Ein bearbeiteter Eintrag weicht vom Original-Standardtext ab und muss
          // deshalb als eigener (isDefault:false) Eintrag markiert werden. Sonst
          // erkennt ensureQuotesForLang() den geänderten Text als "veraltet" und
          // ersetzt beim nächsten Aufruf (z.B. showSettingsPanel() gleich danach)
          // den kompletten Default-Satz wieder durch die Originaltexte — die
          // Änderung wäre dadurch sofort wieder verloren.
          if (newVal) {
            q.text = newVal;
            q.isDefault = false;
            // Bearbeiteten Eintrag an den Anfang der Liste verschieben, damit die
            // Reihenfolge (auch dauerhaft, nicht nur in der Anzeige) den zuletzt
            // geänderten Text zuerst zeigt — genauso wie bei neu hinzugefügten
            // Einträgen (unshift beim Hinzufügen).
            const list = state.quotesByLang[state.settings.lang];
            const idx = list.findIndex(x => x.id === id);
            if (idx > -1) {
              list.splice(idx, 1);
              list.unshift(q);
            }
            // Zusätzlich: Diese Meldung wird für den nächsten Tagesabschluss
            // zwingend als erste Meldung gezogen (siehe pickRandomQuote()).
            // Danach greift wieder das normale Zufallsprinzip.
            state.settings.forcedDayQuoteId = q.id;
            persist();
          }
          showSettingsPanel();
        });
        viewDiv.querySelector('[data-cancel]').addEventListener('click', () => {
          showSettingsPanel();
        });
      });
    });


    const welcomeToggle = overlay.querySelector('#s-welcome-toggle');
    if (welcomeToggle) welcomeToggle.addEventListener('change', (e) => {
      state.settings.showWelcomeOnStart = e.target.checked;
      persist();
    });

    const shareBtn = overlay.querySelector('#s-share-btn');
    if (shareBtn) shareBtn.addEventListener('click', async () => {
      const url = APP_SHARE_URL;
      const shareData = { title: state.settings.appName || 'Challenge App', text: t('share_text'), url };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) { /* Nutzer hat abgebrochen */ }
      } else if (navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(url);
          alert(t('share_copied'));
        } catch (e) {
          alert(url);
        }
      } else {
        alert(url);
      }
    });

    const exportBtn = overlay.querySelector('#d-export');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      const data = { challenges: state.challenges, history: state.history, quotesByLang: state.quotesByLang, completionMessagesByLang: state.completionMessagesByLang, settings: state.settings, exportedOn: todayStr() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'challenge-daten-' + todayStr() + '.json'; a.click();
      URL.revokeObjectURL(url);
    });
    const importBtn = overlay.querySelector('#d-import');
    if (importBtn) importBtn.addEventListener('click', () => document.getElementById('import-file-input').click());

    modalRoot.appendChild(overlay);
  }

  document.getElementById('import-file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        confirmModal(t('import_confirm_title'), t('import_confirm_text'), () => {
          state.challenges = data.challenges || (data.challenge ? [data.challenge] : []);
          state.history = data.history || [];
          state.quotesByLang = data.quotesByLang || data.customQuotes ? (data.quotesByLang || {}) : state.quotesByLang;
          if (!data.quotesByLang && data.customQuotes) {
            const lang = (data.settings && data.settings.lang) || state.settings.lang || 'de';
            ensureQuotesForLang(lang);
            state.quotesByLang[lang] = data.customQuotes.map(q => ({ id: q.id || uid(), text: q.text, isDefault: false })).concat(state.quotesByLang[lang].filter(q => q.isDefault));
          }
          state.completionMessagesByLang = data.completionMessagesByLang || state.completionMessagesByLang;
          state.settings = data.settings || state.settings;
          setupMode = false;
          setupPrefill = null;
          persist();
          applyTheme(state.settings.themeKey, state.settings);
          applyFontSize(state.settings.fontSize);
          applyBranding();
          render();
          showSettingsPanel();
        });
      } catch (err) {
        confirmModal(t('import_fail_title'), t('import_fail_text'), () => {});
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('btn-settings').addEventListener('click', () => showSettingsPanel());

  // Wisch-Navigation: Egal ob nach links oder rechts gewischt wird - auf dem
  // Hauptbildschirm öffnen sich die Einstellungen, in den Einstellungen
  // kommt man zurück zum Hauptbildschirm (wie der ×-Button). Läuft ein
  // anderer Dialog (Bearbeiten-Formular, Bestätigung, etc.), wird nicht
  // gewischt, damit man beim Tippen/Scrollen in Formularen nicht
  // versehentlich die Ansicht wechselt.
  const SWIPE_MIN_DISTANCE = 70;
  const SWIPE_MAX_OFF_AXIS = 60;
  const SWIPE_MAX_DURATION = 600;
  let swipeStartX = null;
  let swipeStartY = null;
  let swipeStartTime = 0;

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { swipeStartX = null; return; }
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeStartTime = Date.now();
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (swipeStartX === null) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - swipeStartX;
    const dy = touch.clientY - swipeStartY;
    const dt = Date.now() - swipeStartTime;
    swipeStartX = null;
    if (dt > SWIPE_MAX_DURATION) return;
    if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return;
    if (Math.abs(dy) > SWIPE_MAX_OFF_AXIS) return;

    const settingsOpen = !!modalRoot.querySelector('.settings-overlay');

    if (settingsOpen) {
      modalRoot.innerHTML = '';
      render();
      return;
    }

    // Ist irgendein anderer Dialog offen (Bearbeiten, Bestätigung, ...),
    // nicht navigieren.
    if (modalRoot.children.length > 0) return;

    showSettingsPanel();
  }, { passive: true });

  let historyExpanded = false;
  document.getElementById('history-toggle').addEventListener('click', () => {
    historyExpanded = !historyExpanded;
    const listEl = document.getElementById('history-list');
    const toggleEl = document.getElementById('history-toggle');
    const iconImgEl = document.getElementById('history-toggle-icon-img');
    listEl.classList.toggle('hidden', !historyExpanded);
    toggleEl.classList.toggle('expanded', historyExpanded);
    if (iconImgEl) iconImgEl.src = historyExpanded ? 'img/info-circle-fill.svg' : 'img/info-circle.svg';
  });

  // Erneutes Anwenden hier ist redundant zum Early-Theme-Script in <head>
  // (das lief schon vor dem ersten Paint), aber günstig als Absicherung:
  // falls sich state.settings beim Laden/Reparieren oben noch verändert hat
  // (z.B. Migration einer alten Version), zieht das hier sauber nach.
  applyTheme(state.settings.themeKey, state.settings);
  applyFontSize(state.settings.fontSize);
  applyBranding();
  render();
  // Nie zwei Start-Modals hintereinander: Begrüßung hat Vorrang; nur wenn
  // sie nicht erscheint UND der Tagesgruß noch nicht heute gezeigt wurde,
  // kommt der tägliche Motivationsgruß.
  if (state.settings.showWelcomeOnStart) {
    showWelcomeModal();
  } else if (state.settings.showDailyMotivation && !wasDailyMotivationShownToday()) {
    showDailyMotivationModal();
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((err) => {
      console.warn('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });

  // Übernimmt ein neuer Service Worker (z.B. nach einem Update im Hintergrund)
  // die Kontrolle, wird die Seite einmalig automatisch neu geladen, damit
  // garantiert die neueste Version angezeigt wird, statt dass man die App
  // manuell schließen und erneut öffnen muss.
  let hasReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hasReloaded) return;
    hasReloaded = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
