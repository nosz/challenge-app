  function load(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

  let pendingOverflowNotice = false;

  let state = {
    challenges: load(KEYS.challenges, null),
    history: load(KEYS.history, []),
    customQuotes: load(KEYS.quotes, []),
    quotesByLang: load(KEYS.quotesByLang, {}),
    completionMessagesByLang: load(KEYS.completionMessagesByLang, {}),
    seededQuoteTexts: load(KEYS.seededQuoteTexts, {}),
    settings: load(KEYS.settings, { appName: 'Challenge', themeKey: 'chahell', lang: 'de', userName: '', maxChallenges: 2, fontSize: 20, showWelcomeOnStart: true, forcedDayQuoteId: null, accordionChallengeCards: true, collapseChallengesOnStart: true, showBoostButton: true, boostDefaultMigratedV2: true, showDailyMotivation: true, customTheme: null, customThemeSaved: null })
  };

  // Migration: früher gab es nur eine einzelne aktive Challenge
  if (state.challenges === null) {
    const legacy = load(KEYS.challenge, null);
    state.challenges = legacy ? [legacy] : [];
  }
  if (typeof state.settings.maxChallenges !== 'number' || state.settings.maxChallenges < 1) {
    state.settings.maxChallenges = 1;
  }
  state.settings.maxChallenges = Math.min(state.settings.maxChallenges, 5);

  if (typeof state.settings.showWelcomeOnStart !== 'boolean') {
    state.settings.showWelcomeOnStart = true;
  }
  if (typeof state.settings.accordionChallengeCards !== 'boolean') {
    state.settings.accordionChallengeCards = false;
  }
  if (typeof state.settings.collapseChallengesOnStart !== 'boolean') {
    state.settings.collapseChallengesOnStart = false;
  }
  if (typeof state.settings.showBoostButton !== 'boolean') {
    state.settings.showBoostButton = true;
  }
  // Einmalige Migration: Der Blitz-Button war bis Version 5.5.2 standardmäßig
  // AUS. Ab jetzt soll er für alle sichtbar sein — auch für Bestandsnutzer,
  // die ihn nie manuell aktiviert haben (bei denen steht showBoostButton
  // bereits als gültiger Boolean auf false, die obige Prüfung greift also
  // NICHT). Der Flag boostDefaultMigratedV2 sorgt dafür, dass das nur EIN
  // einziges Mal passiert — schaltet ein Nutzer den Button danach bewusst
  // wieder aus, bleibt das bei künftigen Updates unangetastet.
  if (!state.settings.boostDefaultMigratedV2) {
    state.settings.showBoostButton = true;
    state.settings.boostDefaultMigratedV2 = true;
  }
  if (typeof state.settings.showDailyMotivation !== 'boolean') {
    state.settings.showDailyMotivation = true;
  }

  const LEGACY_FONT_SIZES = { small: 16, normal: 18, large: 21 };
  if (typeof state.settings.fontSize !== 'number') {
    state.settings.fontSize = LEGACY_FONT_SIZES[state.settings.fontSize] || 18;
  }

  if (!AVAILABLE_LANGS.some(l => l.code === state.settings.lang)) {
    state.settings.lang = 'de';
  }

  let setupMode = false;
  // Wenn gewünscht, sollen alle Challenge-Karten beim App-Start eingeklappt sein.
  let collapsedCards = {};
  if (state.settings.collapseChallengesOnStart) {
    state.challenges.forEach(c => { collapsedCards[c.id] = true; });
  }
  let setupPrefill = null;
  let pendingCompletionModals = [];

  function ensureQuotesForLang(lang) {
    const defaults = DEFAULT_QUOTES[lang] || DEFAULT_QUOTES.de;
    if (!state.quotesByLang[lang]) {
      const seeded = defaults.map(text => ({ id: uid(), text, isDefault: true }));
      state.quotesByLang[lang] = seeded;
      state.seededQuoteTexts[lang] = defaults.slice();
      return true;
    }
    // Migration: seededQuoteTexts gab es früher nicht. Für Sprachen ohne
    // Eintrag wird der aktuelle Standard-Pool einmalig als "bereits bekannt"
    // markiert, damit vorhandene Standardsprüche beim ersten Aufruf nach
    // diesem Update nicht fälschlich als "neu" erkannt und dadurch
    // dupliziert werden.
    let changed = false;
    if (!state.seededQuoteTexts[lang]) {
      state.seededQuoteTexts[lang] = defaults.slice();
      changed = true;
    }
    const seededSet = state.seededQuoteTexts[lang];
    // Nur Standardsprüche ergänzen, die dieser Sprache noch NIE hinzugefügt
    // wurden (z.B. weil ein künftiges Update neue Standardsprüche einführt).
    // Bearbeitet der Nutzer einen Standardspruch und macht ihn dadurch zu
    // einem eigenen Eintrag, bleibt dessen Originaltext trotzdem als
    // "bereits bekannt" markiert und wird NICHT erneut als Standardspruch
    // nachgezogen — das war der ursprüngliche Fehler (Duplikat oben in der
    // Liste nach dem Bearbeiten).
    const newDefaultTexts = defaults.filter(txt => !seededSet.includes(txt));
    if (newDefaultTexts.length) {
      const newEntries = newDefaultTexts.map(text => ({ id: uid(), text, isDefault: true }));
      state.quotesByLang[lang] = newEntries.concat(state.quotesByLang[lang]);
      state.seededQuoteTexts[lang] = seededSet.concat(newDefaultTexts);
      changed = true;
    }
    return changed;
  }

  function ensureCompletionMessagesForLang(lang) {
    const defaults = DEFAULT_COMPLETION_MESSAGES[lang] || DEFAULT_COMPLETION_MESSAGES.de;
    if (!state.completionMessagesByLang[lang]) {
      state.completionMessagesByLang[lang] = defaults.map(text => ({ id: uid(), text, isDefault: true }));
      return true;
    }
    // Bereits vorhanden (z.B. aus einer älteren App-Version mit weniger
    // Standardsätzen) — Standardeinträge mit dem aktuellen Pool abgleichen.
    // Eigene, selbst angelegte Einträge bleiben dabei unangetastet.
    const list = state.completionMessagesByLang[lang];
    const customEntries = list.filter(q => !q.isDefault);
    const currentDefaultTexts = list.filter(q => q.isDefault).map(q => q.text);
    const isUpToDate = currentDefaultTexts.length === defaults.length && defaults.every(txt => currentDefaultTexts.includes(txt));
    if (!isUpToDate) {
      const refreshedDefaults = defaults.map(text => ({ id: uid(), text, isDefault: true }));
      state.completionMessagesByLang[lang] = customEntries.concat(refreshedDefaults);
      return true;
    }
    return false;
  }

  // Abschlussmeldungen der aktuellen Sprache sofort beim Start vorladen bzw.
  // mit dem aktuellen Standardpool abgleichen, damit sie z.B. im Datenexport
  // verlässlich enthalten sind — nicht erst nach dem ersten Challenge-Abschluss.
  (function preloadCompletionMessages() {
    const changed = ensureCompletionMessagesForLang(state.settings.lang);
    if (changed) save(KEYS.completionMessagesByLang, state.completionMessagesByLang);
  })();

  // Gleiches Prinzip für die Tagesmeldungen: sofort beim Start mit dem
  // aktuellen Standardpool abgleichen, statt erst beim nächsten Tagesabschluss.
  (function preloadQuotes() {
    const changed = ensureQuotesForLang(state.settings.lang);
    if (changed) {
      save(KEYS.quotesByLang, state.quotesByLang);
      save(KEYS.seededQuoteTexts, state.seededQuoteTexts);
    }
  })();

  // Einmalige Migration alter, sprachunabhängiger eigener Sprüche in das neue Modell
  (function migrateLegacyQuotes() {
    if (state.customQuotes && state.customQuotes.length && !state.settings._migratedQuotes) {
      const lang = state.settings.lang || 'de';
      ensureQuotesForLang(lang);
      const migrated = state.customQuotes.map(q => ({ id: q.id || uid(), text: q.text, isDefault: false }));
      state.quotesByLang[lang] = migrated.concat(state.quotesByLang[lang]);
      state.settings._migratedQuotes = true;
      state.customQuotes = [];
    }
  })();

  function getQuotes(lang) {
    ensureQuotesForLang(lang);
    const list = state.quotesByLang[lang];
    // Eigene Sprüche zuerst, danach Standardsprüche
    return list.filter(q => !q.isDefault).concat(list.filter(q => q.isDefault));
  }

  function getCompletionMessages(lang) {
    ensureCompletionMessagesForLang(lang);
    const list = state.completionMessagesByLang[lang];
    // Eigene Meldungen zuerst, danach Standardmeldungen
    return list.filter(q => !q.isDefault).concat(list.filter(q => q.isDefault));
  }

  function persist() {
    save(KEYS.challenges, state.challenges);
    save(KEYS.history, state.history);
    save(KEYS.quotes, state.customQuotes);
    save(KEYS.quotesByLang, state.quotesByLang);
    save(KEYS.completionMessagesByLang, state.completionMessagesByLang);
    save(KEYS.seededQuoteTexts, state.seededQuoteTexts);
    save(KEYS.settings, state.settings);
  }

  function t(key, vars) {
    const dict = STRINGS[state.settings.lang] || STRINGS.de;
    let str = dict[key] !== undefined ? dict[key] : (STRINGS.de[key] || key);
    if (vars) { Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); }); }
    return str;
  }

  const DAY_DONE_WORDS = {
    de: ['gemeistert', 'geschafft', 'erledigt', 'durchgezogen', 'im Sack', 'erobert', 'abgehakt', 'gerockt', 'gepackt']
  };
  function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
  }

  function dayDoneLabel(challengeId, dayIndex, current, total) {
    const words = DAY_DONE_WORDS[state.settings.lang] || DAY_DONE_WORDS.de;
    const wordHash = simpleHash(challengeId + ':' + dayIndex + ':word');
    const word = words[wordHash % words.length];
    return t('day_label_done', { current, total, word, date: fmtDisplayWeekdayShort(todayStr()) });
  }

  function daysPhrase(n) {
    const unit = n === 1 ? t('unit_day_singular') : t('unit_day_plural');
    return n + ' ' + unit;
  }

  // applyTheme() und applyFontSize() sind jetzt global im Early-Theme-Script
  // in <head> definiert (laufen dort bereits vor dem ersten Paint) — hier
  // nicht nochmal definieren, nur weiterverwenden. applyTheme() braucht ab
  // jetzt state.settings als 2. Argument (für den 'custom'-Theme-Fall).

  function applyBranding() {
    const name = state.settings.appName || 'Challenge';
    document.title = name;
    const brandEl = document.getElementById('brand-title');
    if (brandEl) brandEl.textContent = name;
    const dateEl = document.getElementById('brand-date');
    if (dateEl) dateEl.textContent = fmtDisplayFull(todayStr());
  }

  function applyStaticStrings() {
    document.getElementById('btn-settings').setAttribute('title', t('settings_btn'));
    document.getElementById('history-title').textContent = t('history_title');
    const energieLink = document.getElementById('link-energietankstelle');
    if (energieLink) {
      energieLink.setAttribute('title', t('energie_btn'));
      energieLink.setAttribute('aria-label', t('energie_btn'));
    }
  }

  // ---------- Datumshilfen ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }
  function todayStr() { return fmt(new Date()); }
  function parseD(str) { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(str, n) { const d = parseD(str); d.setDate(d.getDate() + n); return fmt(d); }
  function daysBetween(fromStr, toStr) { const a = parseD(fromStr), b = parseD(toStr); return Math.round((b - a) / 86400000); }
  function fmtDisplay(str) { const d = parseD(str); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
  // Wochentag + kompaktes Datum ohne Jahr (z.B. "Dienstag, 11.08") - für die
  // Tag-X-von-Y-Zeile, damit sofort erkennbar ist, welcher Wochentag heute ist.
  function fmtDisplayWeekdayShort(str) {
    const d = parseD(str);
    const names = WEEKDAYS[state.settings.lang] || WEEKDAYS.de;
    return names[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  }
  const WEEKDAYS = {
    de: ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'],
    en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
    pl: ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota']
  };
  function fmtDisplayFull(str) {
    const d = parseD(str);
    const names = WEEKDAYS[state.settings.lang] || WEEKDAYS.de;
    return names[d.getDay()] + ', ' + fmtDisplay(str);
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // ---------- Challenge-Logik ----------
  // Status je Tag: 'done' (alle Aufgaben erledigt, egal ob heute oder Vergangenheit),
  // 'missed' (Vergangenheit, nicht komplett), 'today' (heute, noch nicht komplett), 'future'.
  function dayStatusList(challenge) {
    const today = todayStr();
    const list = [];
    for (let i = 1; i <= challenge.days; i++) {
      const dateStr = addDays(challenge.startDate, i - 1);
      const checks = challenge.checks[dateStr];
      const allDone = checks && challenge.tasks.every(tk => checks[tk.id]);
      let status;
      if (dateStr > today) status = 'future';
      else if (allDone) status = 'done';
      else if (dateStr === today) status = 'today';
      else status = 'missed';
      list.push({ dayNum: i, dateStr, status, isToday: dateStr === today });
    }
    return list;
  }

  function computeStats(challenge) {
    const list = dayStatusList(challenge);
    const pastDays = list.filter(d => d.status === 'done' || d.status === 'missed');
    const doneDays = pastDays.filter(d => d.status === 'done');

    // Die Prozentzahl berücksichtigt jede einzelne erledigte Aufgabe, nicht nur
    // komplett abgeschlossene Tage — ein Tag mit 3 von 5 erledigten Aufgaben
    // zählt entsprechend anteilig mit.
    const taskCount = challenge.tasks.length;
    const totalTaskSlots = challenge.days * taskCount;
    let completedTaskSlots = 0;
    list.forEach(d => {
      const checks = challenge.checks[d.dateStr];
      if (checks) {
        completedTaskSlots += challenge.tasks.filter(tk => checks[tk.id]).length;
      }
    });
    const rawRate = totalTaskSlots ? (completedTaskSlots / totalTaskSlots) * 100 : 0;
    // Bei sehr langen Challenges würde ein kleiner Fortschritt auf 0% runden,
    // obwohl etwas geschafft wurde — dann eine Nachkommastelle zeigen.
    const rate = (completedTaskSlots > 0 && rawRate > 0 && rawRate < 1) ? Math.round(rawRate * 10) / 10 : Math.round(rawRate);

    let streak = 0;
    for (let i = list.length - 1; i >= 0; i--) {
      const d = list[i];
      if (d.status === 'done') streak++;
      else if (d.status === 'today' || d.status === 'future') continue;
      else break;
    }
    let longest = 0, cur = 0;
    for (const d of list) {
      if (d.status === 'done') { cur++; longest = Math.max(longest, cur); }
      else if (d.status === 'missed') { cur = 0; }
    }
    return { rate, streak, longest, pastCount: pastDays.length, doneCount: doneDays.length };
  }

  function archiveChallenge(challenge, aborted) {
    const stats = computeStats(challenge);
    state.history.unshift({
      id: challenge.id, title: challenge.title, startDate: challenge.startDate,
      days: challenge.days, tasks: challenge.tasks, checks: challenge.checks,
      aborted: !!aborted, rate: stats.rate, doneCount: stats.doneCount,
      pastCount: stats.pastCount, archivedOn: todayStr()
    });
  }

  // ---------- Rendering ----------
  const root = document.getElementById('app-root');
  const modalRoot = document.getElementById('modal-root');
  const historyList = document.getElementById('history-list');

  // Body-Scroll sperren, solange ein Overlay/Modal offen ist (modal-root nicht
  // leer). Verhindert, dass auf Touch-Geräten die Seite hinter dem Overlay
  // mitscrollt/-rubberbanded. Per MutationObserver zentral gelöst, damit alle
  // ~15 Stellen, die modalRoot.appendChild(...) bzw. modalRoot.innerHTML = ''
  // nutzen, automatisch erfasst werden.
  new MutationObserver(() => {
    document.body.classList.toggle('scroll-locked', modalRoot.children.length > 0);
  }).observe(modalRoot, { childList: true });

  function el(html) { const tpl = document.createElement('template'); tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; }
  function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function showError(box, msg) { box.textContent = msg; box.classList.remove('hidden'); }

  function launchConfetti(mode) {
    const big = mode === 'big';
    const count = big ? 150 : 34;
    const duration = big ? 3000 : 1300;

    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.inset = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '100';
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const w = window.innerWidth, h = window.innerHeight;

    const css = getComputedStyle(document.documentElement);
    const colors = ['--gold', '--gold-soft', '--sage', '--sage-soft', '--rust']
      .map(v => css.getPropertyValue(v).trim())
      .filter(Boolean);

    const pieces = [];
    for (let i = 0; i < count; i++) {
      if (big) {
        pieces.push({
          x: Math.random() * w, y: -20 - Math.random() * h * 0.4,
          vx: (Math.random() - 0.5) * 1.6, vy: 2.4 + Math.random() * 2.6,
          w: 6 + Math.random() * 6, hh: 8 + Math.random() * 10,
          rot: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 0.3,
          sway: Math.random() * Math.PI * 2, color: colors[Math.floor(Math.random() * colors.length)]
        });
      } else {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 4;
        pieces.push({
          x: w / 2, y: h / 2,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
          w: 5 + Math.random() * 5, hh: 7 + Math.random() * 8,
          rot: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 0.35,
          sway: Math.random() * Math.PI * 2, color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(p => {
        p.vy += big ? 0.05 : 0.12;
        p.x += p.vx + Math.sin(elapsed / 300 + p.sway) * 0.5;
        p.y += p.vy;
        p.rot += p.vRot;
        const fade = big ? 1 : Math.max(0, 1 - elapsed / duration);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh);
        ctx.restore();
      });
      if (elapsed < duration) {
        requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  function cardProgressText(done, total) {
    const name = (state.settings.userName || '').trim();
    const exclaimPool = CARD_EXCLAIM[state.settings.lang] || CARD_EXCLAIM.de;
    const exclaim = exclaimPool[(done - 1) % exclaimPool.length];
    const greeting = name ? t('progress_toast_named', { name }) + ' ' : '';
    const countText = t('card_progress_count', { done, total });
    return `${escapeHtml(greeting)}${escapeHtml(countText)} ${escapeHtml(exclaim)}`;
  }

  function render() {
    applyStaticStrings();
    root.innerHTML = '';

    // Selbstreparatur: Challenges mit einer ungültig hohen Tagesanzahl
    // (z.B. Testeingabe) würden die Oberfläche blockieren und werden beendet.
    const bad = state.challenges.filter(c => !Number.isFinite(c.days) || c.days > MAX_DAYS);
    if (bad.length) {
      bad.forEach(c => {
        state.history.unshift({
          id: c.id, title: c.title, startDate: c.startDate, days: MAX_DAYS,
          tasks: c.tasks, checks: {}, aborted: true, rate: 0, doneCount: 0, pastCount: 0, archivedOn: todayStr()
        });
      });
      state.challenges = state.challenges.filter(c => bad.indexOf(c) === -1);
      persist();
      pendingOverflowNotice = true;
    }

    // Abgeschlossene Challenges archivieren und aus der aktiven Liste entfernen
    const today = todayStr();
    const stillActive = [];
    const justFinished = [];
    state.challenges.forEach(c => {
      if (today < c.startDate) { stillActive.push(c); return; }
      const dayIndex = daysBetween(c.startDate, today) + 1;
      const list = dayStatusList(c);
      const finalDayStatus = list.length ? list[list.length - 1].status : 'future';
      const isFinished = dayIndex > c.days || finalDayStatus === 'done';
      if (isFinished) {
        if (!c.archivedOnce) { archiveChallenge(c, false); c.archivedOnce = true; }
        justFinished.push(c);
      } else {
        stillActive.push(c);
      }
    });
    if (justFinished.length) {
      state.challenges = stillActive;
      persist();
      justFinished.forEach(c => pendingCompletionModals.push(c));
    }

    if (setupMode || state.challenges.length === 0) {
      const setupCard = renderSetup(setupPrefill, state.challenges.length > 0);
      root.appendChild(setupCard);
      // Fokus & Scrollposition immer ganz oben bei "Neue Challenge starten" starten,
      // auch wenn die Liste vorher weiter unten gescrollt war.
      window.scrollTo({ top: 0, behavior: 'auto' });
      const heading = setupCard.querySelector('h1');
      if (heading) {
        heading.setAttribute('tabindex', '-1');
        heading.style.outline = 'none';
        heading.focus({ preventScroll: true });
      }
    } else {
      state.challenges.slice().reverse().forEach(c => {
        if (today < c.startDate) root.appendChild(renderWaiting(c));
        else root.appendChild(renderActive(c));
      });
      if (state.challenges.length < state.settings.maxChallenges) {
        root.appendChild(renderAddCard());
      }
    }

    renderHistory();

    if (pendingOverflowNotice) {
      pendingOverflowNotice = false;
      showInfoModal(t('overflow_notice_title'), t('overflow_notice_text', { max: MAX_DAYS }));
    } else if (pendingCompletionModals.length && !modalRoot.querySelector('.completion-modal')) {
      processNextCompletionModal();
    }
  }

  function processNextCompletionModal() {
    if (pendingCompletionModals.length) {
      const next = pendingCompletionModals.shift();
      showChallengeCompleteModal(next);
    }
  }

  function renderAddCard() {
    const btn = el(`<button type="button" class="add-challenge-card"><span class="add-challenge-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke-width="2.4" stroke-linecap="round"/></svg></span><span>${t('add_challenge_btn')}</span></button>`);
    btn.addEventListener('click', () => {
      setupMode = true;
      setupPrefill = null;
      render();
    });
    return btn;
  }

  function renderSetup(prefill, canGoBack) {
    const pf = prefill || {};
    const card = el(`
      <div class="card">
        <h1>${t('setup_title')}</h1>
        <p class="lead">${t('setup_lead')}</p>
        <label>${t('label_title')}</label>
        <input type="text" id="f-title" value="${pf.title ? escapeHtml(pf.title) : ''}" />
        <label>${t('label_days')}</label>
        <input type="number" id="f-days" min="1" max="${MAX_DAYS}" value="${pf.days || 30}" />
        <div id="f-days-error" class="error-msg-inline hidden"></div>
        <label>${t('label_start')}</label>
        <input type="date" id="f-start" min="${todayStr()}" value="${todayStr()}" />
        <label>${t('label_tasks')}</label>
        <div id="task-rows"></div>
        <button type="button" class="add-task-btn" id="f-add-task">${t('add_task_btn')}</button>
        <div id="f-error" class="error-msg hidden"></div>
        <button type="button" class="btn-primary" id="f-submit">${t('setup_submit')}</button>
        ${canGoBack ? `<button type="button" class="btn-secondary" style="margin-top:10px;" id="f-cancel">${t('setup_cancel')}</button>` : ''}
      </div>
    `);

    if (canGoBack) {
      card.querySelector('#f-cancel').addEventListener('click', () => {
        setupMode = false;
        setupPrefill = null;
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      });
    }

    const taskRows = card.querySelector('#task-rows');
    const TASK_EXAMPLES = t('task_examples').split('|');
    function addTaskRow(value, idx) {
      const placeholder = value ? '' : TASK_EXAMPLES[(idx || 0) % TASK_EXAMPLES.length];
      const row = el(`
        <div class="task-row">
          <input type="text" placeholder="${escapeHtml(placeholder)}" value="${value ? escapeHtml(value) : ''}" />
          <button type="button" class="remove" title="${escapeHtml(t('quotes_delete_btn'))}">×</button>
        </div>
      `);
      row.querySelector('.remove').addEventListener('click', () => row.remove());
      taskRows.appendChild(row);
    }
    if (pf.tasks && pf.tasks.length) pf.tasks.forEach(tk => addTaskRow(tk.name));
    else { addTaskRow('', 0); addTaskRow('', 1); }

    card.querySelector('#f-add-task').addEventListener('click', () => {
      addTaskRow('', taskRows.children.length);
      const inputs = taskRows.querySelectorAll('.task-row input');
      const last = inputs[inputs.length - 1];
      if (last) last.focus();
    });

    const daysInput = card.querySelector('#f-days');
    const errBoxLive = card.querySelector('#f-error');
    const daysErrBox = card.querySelector('#f-days-error');
    daysInput.addEventListener('input', () => {
      const val = parseInt(daysInput.value, 10);
      if (daysInput.value !== '' && (!val || val < 1 || val > MAX_DAYS)) {
        daysErrBox.textContent = t('err_days_inline', { max: MAX_DAYS });
        daysErrBox.classList.remove('hidden');
        daysInput.classList.add('input-error');
      } else {
        daysErrBox.classList.add('hidden');
        daysInput.classList.remove('input-error');
      }
    });

    card.querySelector('#f-submit').addEventListener('click', () => {
      const title = card.querySelector('#f-title').value.trim();
      const days = parseInt(card.querySelector('#f-days').value, 10);
      const start = card.querySelector('#f-start').value;
      const taskInputs = Array.from(taskRows.querySelectorAll('input'));
      const taskNames = taskInputs.map(i => i.value.trim()).filter(v => v.length > 0);
      const errBox = card.querySelector('#f-error');
      if (!title) return showError(errBox, t('err_title'));
      if (!days || days < 1 || days > MAX_DAYS) {
        daysErrBox.textContent = t('err_days_inline', { max: MAX_DAYS });
        daysErrBox.classList.remove('hidden');
        daysInput.classList.add('input-error');
        daysInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (!start) return showError(errBox, t('err_start'));
      if (start < todayStr()) return showError(errBox, t('err_start_past'));
      if (taskNames.length === 0) return showError(errBox, t('err_tasks'));
      if (state.challenges.length >= state.settings.maxChallenges) {
        return showError(errBox, t('max_challenges_note', { max: state.settings.maxChallenges, settingsLink: t('settings_link_word') }));
      }

      state.challenges.push({
        id: uid(), title, days, startDate: start,
        tasks: taskNames.map(n => ({ id: uid(), name: n })), checks: {}
      });
      setupMode = false;
      setupPrefill = null;
      persist();
      render();
      window.scrollTo({ top: 0, behavior: 'auto' });
    });

    return card;
  }

  // Verschiebt eine Challenge in der Reihenfolge. Da die Karten in umgekehrter
  // Array-Reihenfolge angezeigt werden (das letzte Element steht optisch oben),
  // bedeutet "nach oben" ein Vorrücken im Array-Index und "nach unten" ein
  // Zurückrücken.
  function moveChallenge(c, direction) {
    const idx = state.challenges.findIndex(x => x.id === c.id);
    if (idx === -1) return;
    const swapIdx = direction === 'up' ? idx + 1 : idx - 1;
    if (swapIdx < 0 || swapIdx >= state.challenges.length) return;
    const tmp = state.challenges[idx];
    state.challenges[idx] = state.challenges[swapIdx];
    state.challenges[swapIdx] = tmp;
    persist();
    render();
  }

  const ARROW_UP_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 19h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M12 15V6M7 10l5-5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ARROW_DOWN_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M12 9v9M7 14l5 5 5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // Icon für den "Challenge vorzeitig beenden"-Button im Footer. Bewusst im
  // gleichen neutralen Stroke-Stil wie EDIT_SVG gehalten (keine Warnfarbe im
  // Icon selbst, die Farbgebung kommt ausschließlich über die Button-Klasse).
  const ABORT_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9.3 9.3l5.4 5.4M14.7 9.3l-5.4 5.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  // Check-Badge für die eingeklappte Karte bei komplett erledigtem Tag
  // (ersetzt das bisherige App-Icon dort durch ein echtes "erledigt"-Signal).
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // Icon für den Motivations-Blitz-Button. Als <img> auf die separate SVG-
  // Datei verwiesen (statt Inline-SVG wie die übrigen Icons), damit sie sich
  // per CSS-Filter/Farbe auffällig in Gold absetzen lässt und weil sie —
  // anders als die neutralen Stroke-Icons — bewusst als "besonderer" Button
  // erkennbar sein soll.
  const BOOST_ICON_HTML = '<img src="img/lightning-charge.svg" alt="" class="boost-btn-icon">';

  // Erzeugt die Auf/Ab-Pfeile zum Umsortieren, als eigenständige Buttons
  // neben "Bearbeiten" im Footer. Nur sichtbar, wenn mehr als eine
  // Challenge aktiv/anstehend ist. An den Rand-Positionen wird nur der
  // tatsächlich mögliche Pfeil gerendert.
  function reorderButtonsHtml(c) {
    if (state.challenges.length < 2) return '';
    const idx = state.challenges.findIndex(x => x.id === c.id);
    const canMoveUp = idx < state.challenges.length - 1;
    const canMoveDown = idx > 0;
    return `
      <div class="reorder-btns-row">
        ${canMoveUp ? `<button type="button" class="reorder-btn" id="btn-move-up" title="${escapeHtml(t('reorder_up'))}" aria-label="${escapeHtml(t('reorder_up'))}">${ARROW_UP_SVG}</button>` : ''}
        ${canMoveDown ? `<button type="button" class="reorder-btn" id="btn-move-down" title="${escapeHtml(t('reorder_down'))}" aria-label="${escapeHtml(t('reorder_down'))}">${ARROW_DOWN_SVG}</button>` : ''}
      </div>
    `;
  }

  function bindReorderButtons(card, c) {
    const upBtn = card.querySelector('#btn-move-up');
    if (upBtn) upBtn.addEventListener('click', () => moveChallenge(c, 'up'));
    const downBtn = card.querySelector('#btn-move-down');
    if (downBtn) downBtn.addEventListener('click', () => moveChallenge(c, 'down'));
  }

  function renderWaiting(c) {
    const daysUntil = daysBetween(todayStr(), c.startDate);
    const taskUnit = c.tasks.length === 1 ? t('unit_task_singular') : t('unit_task_plural');
    const endDate = addDays(c.startDate, c.days - 1);
    const isCollapsed = collapsedCards[c.id] === true;

    const collapsedInfoHtml = isCollapsed
      ? `<div class="card-collapsed-status">${t('waiting_collapsed', { date: fmtDisplayFull(c.startDate) })}</div>`
      : '';

    const card = el(`
      <div class="card">
        <div class="card-title-row">
          <button type="button" class="card-toggle" id="btn-collapse">
            <h1>${escapeHtml(c.title)}</h1>
            <span class="card-toggle-icon"><img src="${isCollapsed ? 'img/info-circle.svg' : 'img/info-circle-fill.svg'}" alt=""></span>
          </button>
        </div>
        ${collapsedInfoHtml}
        ${!isCollapsed ? `
          <div class="card-collapse-zone">
            <p class="lead">${t('waiting_lead', { date: fmtDisplayFull(c.startDate), daysPhrase: daysPhrase(daysUntil) })}</p>
            <div class="meta-line">${t('active_dates', { start: fmtDisplay(c.startDate), end: fmtDisplay(endDate) })}</div>
            <div class="meta-line">${t('waiting_meta', { days: c.days, daysUnit: c.days === 1 ? t('unit_day_singular') : t('unit_day_plural'), tasks: c.tasks.length, tasksUnit: taskUnit })}</div>
          </div>
          <div class="card-footer-links">
            <div class="card-footer-row">
              <button type="button" class="card-action-btn" id="btn-edit">${EDIT_SVG}<span>${t('edit_btn')}</span></button>
              ${reorderButtonsHtml(c)}
            </div>
            <button type="button" class="card-action-btn card-abort-btn" id="btn-abort">${ABORT_SVG}<span>${t('abort_btn')}</span></button>
          </div>
        ` : ''}
      </div>
    `);

    const toggleCollapse = () => {
      const willExpand = isCollapsed;
      // Akkordeon-Modus: Beim Aufklappen einer Karte werden alle anderen eingeklappt.
      if (willExpand && state.settings.accordionChallengeCards) {
        state.challenges.forEach(other => {
          if (other.id !== c.id) collapsedCards[other.id] = true;
        });
      }
      collapsedCards[c.id] = !isCollapsed;
      render();
    };

    // Im eingeklappten Zustand ist die komplette Karte klickbar (nicht nur der
    // Header-Button), damit das Aufklappen auch beim Tippen auf den unteren
    // Kartenbereich funktioniert. Im aufgeklappten Zustand ist zusätzlich zum
    // Header-Button auch die .card-collapse-zone (Info-Text + Meta-Zeilen)
    // zum Einklappen klickbar. Bearbeiten/Abbrechen-Buttons bleiben bewusst
    // außen vor, damit Klicks darauf nicht versehentlich die Karte schließen.
    card.addEventListener('click', (e) => {
      if (e.target.closest('.reorder-btns-row')) return;
      if (isCollapsed) {
        toggleCollapse();
        return;
      }
      if (e.target.closest('#btn-collapse') || e.target.closest('.card-collapse-zone')) {
        toggleCollapse();
      }
    });
    if (isCollapsed) card.classList.add('card-collapsed-clickable');

    const editBtn = card.querySelector('#btn-edit');
    if (editBtn) editBtn.addEventListener('click', () => showEditChallengeModal(c));
    const abortBtn = card.querySelector('#btn-abort');
    if (abortBtn) abortBtn.addEventListener('click', () => {
      confirmModal(t('abort_future_title'), t('abort_future_text'), () => {
        archiveChallenge(c, true);
        state.challenges = state.challenges.filter(x => x.id !== c.id);
        persist();
        render();
      });
    });
    bindReorderButtons(card, c);
    return card;
  }

  const WEEK_SIZE = 7;

  // Wählt den 7-Tage-Block (Kalenderwoche der Challenge), der den übergebenen
  // Tag enthält — z.B. Tag 15 liegt im Block Tag 15–21. So werden auf der
  // Oberfläche immer nur die aktuellen 7 Tage als einzelne Punkte angezeigt,
  // ohne mehrere Tage zu einem Punkt zusammenzufassen.
  function getCurrentWeekSlice(list, dayIndex) {
    const idx = Math.min(Math.max(dayIndex, 1), list.length) - 1;
    const weekStart = Math.floor(idx / WEEK_SIZE) * WEEK_SIZE;
    return list.slice(weekStart, weekStart + WEEK_SIZE);
  }

  // Baut die Punkte-Anzeige: immer ein Punkt pro Tag, keine Aufteilung/Zusammenfassung.
  function dayNodesHtml(list, notes) {
    return list.map(d => {
      const cls = d.status + (d.isToday ? ' is-today' : '');
      const content = d.status === 'done' ? '✓' : d.dayNum;
      let titleText = fmtDisplay(d.dateStr);
      const note = notes && notes[d.dateStr];
      if (note) titleText += ' — ' + note;
      return `<div class="day-node ${cls}" title="${escapeHtml(titleText)}">${content}</div>`;
    }).join('');
  }

  function renderActive(c) {
    const list = dayStatusList(c);
    const stats = computeStats(c);
    const today = todayStr();
    const todayChecks = c.checks[today] || {};
    const dayIndex = daysBetween(c.startDate, today) + 1;

    const weekList = getCurrentWeekSlice(list, dayIndex);
    const pathHtml = dayNodesHtml(weekList);
    const showRangeNote = c.days > WEEK_SIZE;

    const taskHtml = c.tasks.map(tk => {
      const checked = !!todayChecks[tk.id];
      return `
        <div class="task-check ${checked ? 'checked' : ''}" data-task-id="${tk.id}">
          <div class="box">${checked ? '✓' : ''}</div>
          <div class="name">${escapeHtml(tk.name)}</div>
        </div>
      `;
    }).join('');

    const endDate = addDays(c.startDate, c.days - 1);
    const doneToday = c.tasks.filter(tk => todayChecks[tk.id]).length;
    let cardStatusHtml = '';
    if (doneToday > 0 && doneToday < c.tasks.length) {
      cardStatusHtml = `<div class="card-progress-status">${cardProgressText(doneToday, c.tasks.length)}</div>`;
    } else if (doneToday > 0 && doneToday === c.tasks.length) {
      const msg = getDayCompletionMessage(c, today);
      cardStatusHtml = `<div class="card-progress-status card-progress-complete"><span class="cpc-badge">${escapeHtml(msg.badge)}</span><span class="cpc-quote">${escapeHtml(msg.quote)}</span></div>`;
    }
    const isCollapsed = collapsedCards[c.id] === true;

    let collapsedInfoHtml = '';
    if (isCollapsed && c.tasks.length > 0) {
      const totalToday = c.tasks.length;
      const remainingToday = totalToday - doneToday;
      const isDayComplete = doneToday === totalToday;
      let collapsedMsg;
      if (doneToday === 0) {
        collapsedMsg = pickCollapsedText(COLLAPSED_START_MSGS, `${c.id}|${today}|start`, {});
      } else if (isDayComplete) {
        collapsedMsg = pickCollapsedText(COLLAPSED_COMPLETE_MSGS, `${c.id}|${today}|complete`, {});
      } else {
        collapsedMsg = pickCollapsedText(COLLAPSED_PROGRESS_MSGS, `${c.id}|${today}|progress|${doneToday}`, { done: doneToday, total: totalToday, remaining: remainingToday });
      }
      // Nur bei komplett erledigtem Tag gibt es das Check-Badge + den
      // Akzent-Hintergrund als "Erfolgssignal". Bei 0 bzw. teilweise
      // erledigt steht bewusst nur reiner Text da, ohne Icon.
      collapsedInfoHtml = isDayComplete
        ? `<div class="card-collapsed-status card-collapsed-complete"><span class="card-collapsed-check">${CHECK_SVG}</span>${escapeHtml(collapsedMsg)}</div>`
        : `<div class="card-collapsed-status">${escapeHtml(collapsedMsg)}</div>`;
    }

    const card = el(`
      <div class="card">
        <div class="card-title-row">
          <button type="button" class="card-toggle" id="btn-collapse">
            <h1>${escapeHtml(c.title)}</h1>
          </button>
          ${(!isCollapsed && state.settings.showBoostButton && doneToday < c.tasks.length) ? `<button type="button" class="card-title-boost-btn" id="btn-boost" title="${escapeHtml(t('boost_btn_label'))}" aria-label="${escapeHtml(t('boost_btn_label'))}">${BOOST_ICON_HTML}</button>` : ''}
          <span class="card-toggle-icon" id="btn-collapse-icon"><img src="${isCollapsed ? 'img/info-circle.svg' : 'img/info-circle-fill.svg'}" alt=""></span>
        </div>
        ${collapsedInfoHtml}
        ${!isCollapsed ? `
          <div class="card-subtitle">${doneToday === c.tasks.length && c.tasks.length > 0 ? dayDoneLabel(c.id, dayIndex, dayIndex, c.days) : t('day_label', { current: dayIndex, total: c.days, date: fmtDisplayWeekdayShort(todayStr()) })}</div>
          <div class="task-highlight">
            <div class="task-list compact">${taskHtml}</div>
          </div>
          ${cardStatusHtml}
          <div class="card-collapse-zone">
            <div class="path">${pathHtml}</div>
            ${showRangeNote ? `<div class="path-note">${t('chunk_range', { start: weekList[0].dayNum, end: weekList[weekList.length - 1].dayNum })}</div>` : ''}
            <div class="progress-row">
              <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${stats.rate}%"></div></div>
            </div>
          </div>
          <div class="card-footer-links">
            <div class="card-footer-row">
              ${reorderButtonsHtml(c)}
              <button type="button" class="card-action-btn" id="btn-edit">${EDIT_SVG}<span>${t('edit_btn')}</span></button>
            </div>
          </div>
        ` : ''}
      </div>
    `);

    const toggleCollapse = () => {
      const willExpand = isCollapsed;
      // Akkordeon-Modus: Beim Aufklappen einer Karte werden alle anderen eingeklappt.
      if (willExpand && state.settings.accordionChallengeCards) {
        state.challenges.forEach(other => {
          if (other.id !== c.id) collapsedCards[other.id] = true;
        });
      }
      collapsedCards[c.id] = !isCollapsed;
      render();
    };

    // Im eingeklappten Zustand ist die komplette Karte klickbar (nicht nur der
    // Header-Button), damit das Aufklappen auch beim Tippen auf den unteren
    // Kartenbereich funktioniert. Im aufgeklappten Zustand ist zusätzlich zum
    // Header-Button (inkl. dem separat stehenden i-Icon, das aus dem Button
    // herausgelöst wurde, damit der Blitz-Button als eigenständiges Element
    // daneben Platz hat) auch die .card-collapse-zone (Tag-/Datums-Zeile,
    // Wochen-Punkte, Fortschrittsbalken inkl. %-Zahl) zum Einklappen klickbar.
    // Aufgaben-Checkliste und Bearbeiten/Abbrechen-Buttons bleiben bewusst
    // außen vor, damit Klicks darauf nicht versehentlich die Karte schließen.
    card.addEventListener('click', (e) => {
      if (e.target.closest('.reorder-btns-row') || e.target.closest('#btn-boost')) return;
      if (isCollapsed) {
        toggleCollapse();
        return;
      }
      if (e.target.closest('#btn-collapse') || e.target.closest('#btn-collapse-icon') || e.target.closest('.card-collapse-zone')) {
        toggleCollapse();
      }
    });
    if (isCollapsed) card.classList.add('card-collapsed-clickable');

    const editBtn = card.querySelector('#btn-edit');
    if (editBtn) editBtn.addEventListener('click', () => showEditChallengeModal(c));
    const boostBtn = card.querySelector('#btn-boost');
    if (boostBtn) boostBtn.addEventListener('click', () => showBoostModal());

    card.querySelectorAll('.task-check').forEach(row => {
      row.addEventListener('click', () => {
        const taskId = row.getAttribute('data-task-id');
        if (!c.checks[today]) c.checks[today] = {};
        const willBeChecked = !c.checks[today][taskId];
        c.checks[today][taskId] = willBeChecked;
        persist();

        const nowComplete = c.tasks.every(tk => c.checks[today][tk.id]);
        const isLastDay = dayIndex === c.days;
        // Bei einem frischen Tagesabschluss (nicht der allerletzte Challenge-Tag,
        // dort greift die separate Abschluss-Sondermeldung) MUSS die
        // Tagesmeldung hier — vor render() — gezogen werden. Sonst könnte
        // render() zuerst eine andere, bereits fertige Karte rendern und ihr
        // damit versehentlich eine evtl. erzwungene Meldung wegschnappen
        // (siehe drawDayCompletionMessage()).
        if (willBeChecked && nowComplete && !isLastDay) {
          drawDayCompletionMessage(c, today);
        }
        render();
        if (willBeChecked && nowComplete && isLastDay) {
          // Abschluss-Sondermeldung wurde bereits von render() ausgelöst
        } else if (willBeChecked && nowComplete) {
          // Erfolgsmodal anzeigen; der Text bleibt danach zusätzlich in der Karte stehen
          // (siehe cardStatusHtml / getDayCompletionMessage, nutzt dieselbe Meldung).
          showQuoteModal(c, today);
        } else if (willBeChecked) {
          launchConfetti('small');
        }
      });
    });

    bindReorderButtons(card, c);

    return card;
  }


  // Verlaufsliste nur neu bauen, wenn sich die Historie (oder die Sprache,
  // die den angezeigten Text beeinflusst) seit dem letzten Aufruf wirklich
  // geändert hat. renderHistory() lief bisher bei JEDEM render() komplett
  // durch — also bei jedem Task-Klick, jeder Modal-Aktion usw. — selbst wenn
  // die Historie eingeklappt/unverändert war. Über die Zeit (viele
  // archivierte Challenges) macht das jede Interaktion spürbar träger.
  let lastHistorySignature = null;
  function renderHistory() {
    const historyCard = document.getElementById('history-card');
    if (state.history.length === 0) {
      if (historyCard) historyCard.style.display = 'none';
      lastHistorySignature = null;
      return;
    }
    if (historyCard) historyCard.style.display = '';
    const signature = state.settings.lang + '|' + state.history.map(h => h.id).join(',');
    if (signature === lastHistorySignature) return;
    lastHistorySignature = signature;
    historyList.innerHTML = '';
    state.history.forEach(h => {
      const daysUnit = h.days === 1 ? t('unit_day_singular') : t('unit_day_plural');
      const metaKey = h.aborted ? 'history_meta_aborted' : 'history_meta';
      const item = el(`
        <div class="history-item-wrap">
          <div class="history-item">
            <div class="h-title">${escapeHtml(h.title)}${h.aborted ? ' <span style="color:var(--text-faint);font-size:0.75rem;">' + t('history_aborted') + '</span>' : ''}</div>
            <div class="h-meta">${t(metaKey, { date: fmtDisplay(h.startDate), days: h.days, daysUnit, done: h.doneCount, total: h.pastCount || h.days })}</div>
            <div class="h-footer">
              <div class="h-rate">${h.rate}%</div>
              <div class="h-links">
                <button type="button" class="text-link-btn" id="h-tpl-${h.id}">${t('use_as_template_btn')}</button>
                <button type="button" class="text-link-btn" id="h-del-${h.id}">${t('history_delete')}</button>
              </div>
            </div>
          </div>
        </div>
      `);
      item.querySelector('#h-tpl-' + h.id).addEventListener('click', () => {
        setupPrefill = { title: h.title, days: h.days, tasks: h.tasks };
        setupMode = true;
        render();
      });
      item.querySelector('#h-del-' + h.id).addEventListener('click', () => {
        confirmModal(t('history_delete_title'), t('history_delete_text', { title: h.title }), () => {
          state.history = state.history.filter(x => x.id !== h.id);
          persist();
          render();
          focusAfterHistoryDelete();
        });
      });
      historyList.appendChild(item);
    });
  }

  // Nach dem Löschen eines Historien-Eintrags den Cursor/Fokus gezielt setzen:
  // Gibt es noch weitere vergangene Challenges, geht es zur Überschrift
  // "Vergangene Challenges". Ist die Historie jetzt leer (und der Bereich
  // damit ausgeblendet), geht es stattdessen ganz nach oben zu
  // "Neue Challenge starten" (bzw. wo immer die Seite dann beginnt).
  function focusAfterHistoryDelete() {
    if (state.history.length > 0) {
      const heading = document.getElementById('history-title');
      if (heading) {
        heading.setAttribute('tabindex', '-1');
        heading.style.outline = 'none';
        // Der sticky Header oben überdeckt sonst einen Teil der Überschrift,
        // wenn direkt mit scrollIntoView(block:'start') dorthin gesprungen
        // wird. Deshalb wird hier manuell gescrollt und die aktuelle
        // Header-Höhe plus etwas Extra-Abstand als Puffer abgezogen.
        const stickyHeader = document.querySelector('header.top');
        const headerOffset = (stickyHeader ? stickyHeader.offsetHeight : 0) + 16;
        const targetY = heading.getBoundingClientRect().top + window.scrollY - headerOffset;
        window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
        heading.focus({ preventScroll: true });
      }
      return;
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const target = document.querySelector('#app-root h1') || document.querySelector('.add-challenge-card');
    if (target) {
      if (target.tagName === 'H1') {
        target.setAttribute('tabindex', '-1');
        target.style.outline = 'none';
      }
      target.focus({ preventScroll: true });
    }
  }

  // ---------- Modale ----------
  function confirmModal(title, text, onConfirm) {
    modalRoot.innerHTML = '';
    const overlay = el(`
      <div class="overlay">
        <div class="modal">
          <h2>${escapeHtml(title)}</h2>
          <p class="confirm-text">${escapeHtml(text)}</p>
          <div class="modal-actions">
            <button class="btn-secondary" id="c-cancel">${t('confirm_cancel')}</button>
            <button class="btn-primary" style="margin-top:0;" id="c-ok">${t('confirm_ok')}</button>
          </div>
        </div>
      </div>
    `);
    overlay.querySelector('#c-cancel').addEventListener('click', () => modalRoot.innerHTML = '');
    overlay.querySelector('#c-ok').addEventListener('click', () => { modalRoot.innerHTML = ''; onConfirm(); });
    modalRoot.appendChild(overlay);
  }

  function showInfoModal(title, text) {
    modalRoot.innerHTML = '';
    const overlay = el(`
      <div class="overlay">
        <div class="modal">
          <h2>${escapeHtml(title)}</h2>
          <p class="confirm-text">${escapeHtml(text)}</p>
          <button class="btn-primary" style="margin-top:0;" id="info-ok">${t('confirm_ok')}</button>
        </div>
      </div>
    `);
    overlay.querySelector('#info-ok').addEventListener('click', () => modalRoot.innerHTML = '');
    modalRoot.appendChild(overlay);
  }

  function showWelcomeModal() {
    // Zählt den heutigen Tag als "Begrüßung schon gezeigt" — verhindert,
    // dass am selben Tag zusätzlich noch der tägliche Motivationsgruß
    // aufpoppt (siehe showDailyMotivationModal). Gilt auch, falls
    // "Begrüßung beim Start" später in den Einstellungen wieder aktiviert
    // wird und an einem Tag erneut erscheint.
    markDailyMotivationShownToday();
    modalRoot.innerHTML = '';
    const overlay = el(`
      <div class="overlay">
        <div class="modal welcome-modal">
          <img src="icon-192.png" alt="" class="welcome-icon">
          <h2>${escapeHtml(t('welcome_title'))}</h2>
          <p class="welcome-text">${escapeHtml(t('welcome_text'))}</p>
          <button class="btn-primary" style="margin-top:0;" id="welcome-ok">${t('welcome_start_btn')}</button>
        </div>
      </div>
    `);
    overlay.querySelector('#welcome-ok').addEventListener('click', () => {
      modalRoot.innerHTML = '';
      state.settings.showWelcomeOnStart = false;
      persist();
    });
    modalRoot.appendChild(overlay);
  }

  // ---------- Täglicher Motivationsgruß ----------
  // Einmal pro Kalendertag, beim ersten (manuellen) Öffnen der App. Nutzt
  // einen eigenen, rohen localStorage-Key (nicht Teil von motiv_settings),
  // da es sich um einen reinen "wurde heute schon gezeigt"-Merker handelt,
  // keine Nutzereinstellung. Ein Tag gilt ebenso als "gezeigt", wenn
  // stattdessen das Welcome-Modal erschien (siehe showWelcomeModal) — es
  // sollen nie zwei Start-Modals am selben Tag hintereinander erscheinen.
  function markDailyMotivationShownToday() {
    try { localStorage.setItem(KEYS.dailyMotivationLast, todayStr()); } catch (e) { /* ignore */ }
  }
  function wasDailyMotivationShownToday() {
    try { return localStorage.getItem(KEYS.dailyMotivationLast) === todayStr(); } catch (e) { return false; }
  }

  // Liefert je Tageszeit den passenden Begrüßungs-Schlüssel (Nacht/Morgen/
  // Tag/Abend). Grenzen bewusst grob gehalten: 0–5 Uhr Nacht ("Hallo" statt
  // "Guten Abend"/"Guten Morgen", da beides nachts unpassend wirkt), 6–10
  // Uhr Morgen, 11–17 Uhr Tag, ab 18 Uhr Abend.
  function dailyGreetingKeys() {
    const hour = new Date().getHours();
    if (hour < 6) return { generic: 'daily_greeting_night', personal: 'daily_greeting_night_personal' };
    if (hour < 11) return { generic: 'daily_greeting_morning', personal: 'daily_greeting_morning_personal' };
    if (hour < 18) return { generic: 'daily_greeting_day', personal: 'daily_greeting_day_personal' };
    return { generic: 'daily_greeting_evening', personal: 'daily_greeting_evening_personal' };
  }

  function showDailyMotivationModal() {
    const name = (state.settings.userName || '').trim();
    const rawMessage = pickRandomDailyMotivationMessage(state.settings.lang);
    const escaped = escapeHtml(rawMessage);
    // Gleiches {name}-Muster wie showBoostModal/showChallengeCompleteModal.
    const messageHtml = name
      ? escaped.split('{name}').join(`<span class="name-highlight">${escapeHtml(name)}</span>`)
      : (() => {
          const cleaned = escaped.replace(/\{name\},\s*/g, '').replace(/\{name\}\s*/g, '');
          return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
        })();
    const greetingKeys = dailyGreetingKeys();
    modalRoot.innerHTML = '';
    const overlay = el(`
      <div class="overlay">
        <div class="modal quote-modal daily-motivation-modal">
          <img src="icon-192.png" alt="" class="welcome-icon">
          <div class="badge">${personalBadge(greetingKeys.generic, greetingKeys.personal)}</div>
          <p class="quote-text">${messageHtml}</p>
          <button class="btn-primary" style="margin-top:0;" id="daily-motivation-close">${escapeHtml(pickRandomCtaCloseLabel(state.settings.lang))}</button>
        </div>
      </div>
    `);
    overlay.querySelector('#daily-motivation-close').addEventListener('click', () => modalRoot.innerHTML = '');
    modalRoot.appendChild(overlay);
    markDailyMotivationShownToday();
  }

  function historyDayStatusList(h) {
    const list = [];
    for (let i = 1; i <= h.days; i++) {
      const dateStr = addDays(h.startDate, i - 1);
      const checks = h.checks && h.checks[dateStr];
      const allDone = checks && h.tasks.every(tk => checks[tk.id]);
      list.push({ dayNum: i, dateStr, status: allDone ? 'done' : 'missed', isToday: false });
    }
    return list;
  }

  function showEditChallengeModal(c) {
    const isStarted = todayStr() >= c.startDate;
    const dayIndex = isStarted ? daysBetween(c.startDate, todayStr()) + 1 : 1;
    const minDays = isStarted ? dayIndex : 1;

    modalRoot.innerHTML = '';
    const overlay = el(`
      <div class="overlay">
        <div class="modal" style="text-align:left; max-height:85vh; overflow-y:auto; max-width:480px;">
          <h2>${t('edit_title')}</h2>

          <label>${t('label_title')}</label>
          <input type="text" id="e-title" value="${escapeHtml(c.title)}" />

          ${isStarted ? `<div class="meta-line" style="margin:2px 0 14px;">${t('active_dates', { start: fmtDisplay(c.startDate), end: fmtDisplay(addDays(c.startDate, c.days - 1)) })}</div>` : ''}

          <label>${t('label_days')}</label>
          <input type="number" id="e-days" min="${minDays}" max="${MAX_DAYS}" value="${c.days}" />
          <div id="e-days-error" class="error-msg-inline hidden"></div>
          ${isStarted ? `<div class="lang-note">${t('edit_days_note', { min: minDays })}</div>` : ''}

          ${!isStarted ? `
            <label>${t('label_start')}</label>
            <input type="date" id="e-start" min="${todayStr()}" value="${c.startDate}" />
          ` : ''}

          <label>${t('label_tasks')}</label>
          <div id="e-task-rows"></div>
          <button type="button" class="add-task-btn" id="e-add-task">${t('add_task_btn')}</button>

          <div id="e-error" class="error-msg hidden"></div>
          <button type="button" class="btn-primary" id="e-save">${t('edit_save_btn')}</button>
          <button type="button" class="btn-secondary" style="margin-top:10px;" id="e-cancel">${t('confirm_cancel')}</button>
          ${isStarted ? `<button type="button" class="text-link-btn" id="e-abort" style="margin-top:16px; display:block; text-align:center; width:100%;">${t('abort_btn')}</button>` : ''}
        </div>
      </div>
    `);

    const taskRows = overlay.querySelector('#e-task-rows');
    function addEditTaskRow(name, taskId) {
      const row = el(`
        <div class="task-row" ${taskId ? `data-task-id="${taskId}"` : ''}>
          <input type="text" placeholder="${escapeHtml(t('task_placeholder'))}" value="${escapeHtml(name || '')}" />
          <button type="button" class="remove" title="${escapeHtml(t('quotes_delete_btn'))}">×</button>
        </div>
      `);
      row.querySelector('.remove').addEventListener('click', () => row.remove());
      taskRows.appendChild(row);
    }
    c.tasks.forEach(tk => addEditTaskRow(tk.name, tk.id));
    overlay.querySelector('#e-add-task').addEventListener('click', () => {
      addEditTaskRow('', null);
      const inputs = taskRows.querySelectorAll('.task-row input');
      const last = inputs[inputs.length - 1];
      if (last) last.focus();
    });

    const daysInput = overlay.querySelector('#e-days');
    const daysErrBox = overlay.querySelector('#e-days-error');
    daysInput.addEventListener('input', () => {
      const val = parseInt(daysInput.value, 10);
      if (daysInput.value !== '' && (!val || val < minDays || val > MAX_DAYS)) {
        daysErrBox.textContent = t('edit_err_days', { min: minDays, max: MAX_DAYS });
        daysErrBox.classList.remove('hidden');
        daysInput.classList.add('input-error');
      } else {
        daysErrBox.classList.add('hidden');
        daysInput.classList.remove('input-error');
      }
    });

    overlay.querySelector('#e-cancel').addEventListener('click', () => modalRoot.innerHTML = '');

    const abortLink = overlay.querySelector('#e-abort');
    if (abortLink) {
      abortLink.addEventListener('click', () => {
        confirmModal(t('abort_active_title'), t('abort_active_text'), () => {
          archiveChallenge(c, true);
          state.challenges = state.challenges.filter(x => x.id !== c.id);
          persist();
          modalRoot.innerHTML = '';
          render();
        });
      });
    }

    overlay.querySelector('#e-save').addEventListener('click', () => {
      const errBox = overlay.querySelector('#e-error');
      const title = overlay.querySelector('#e-title').value.trim();
      const days = parseInt(daysInput.value, 10);
      const rows = Array.from(taskRows.querySelectorAll('.task-row'));
      const newTasks = rows.map(row => {
        const name = row.querySelector('input').value.trim();
        const existingId = row.getAttribute('data-task-id');
        return name ? { id: existingId || uid(), name } : null;
      }).filter(Boolean);

      if (!title) return showError(errBox, t('err_title'));
      if (!days || days < minDays || days > MAX_DAYS) {
        daysErrBox.textContent = t('edit_err_days', { min: minDays, max: MAX_DAYS });
        daysErrBox.classList.remove('hidden');
        daysInput.classList.add('input-error');
        daysInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (newTasks.length === 0) return showError(errBox, t('err_tasks'));

      let newStart = c.startDate;
      if (!isStarted) {
        const startInput = overlay.querySelector('#e-start');
        newStart = startInput.value;
        if (!newStart) return showError(errBox, t('err_start'));
        if (newStart < todayStr()) return showError(errBox, t('err_start_past'));

      c.title = title;
      c.days = days;
      c.startDate = newStart;
      c.tasks = newTasks;
      persist();
      modalRoot.innerHTML = '';
      render();
    });

  function pickRandomQuote(lang) {
    const list = getQuotes(lang);
    // Alle Sprüche (eigene + Standard) bilden einen gemeinsamen Pool mit
    // Gleichgewichtung pro Spruch. Vorher bekamen "eigene" Sprüche pauschal
    // 50% der Chance, egal wie viele es gibt — bei nur einem eigenen Spruch
    // gegenüber z.B. 30 Standardsprüchen erschien dieser eine dadurch bei
    // fast jedem zweiten Tagesabschluss, was sich wie ein Fehler ("immer die
    // gleiche Meldung") anfühlte.
    // HINWEIS: forcedDayQuoteId wird bewusst NICHT hier ausgewertet, siehe
    // drawDayCompletionMessage(). Diese Funktion liefert immer eine echte
    // Zufallsauswahl.
    return list[Math.floor(Math.random() * list.length)].text;
  }

  function pickRandomCompletionMessage(lang) {
    const list = getCompletionMessages(lang);
    // Gleiches Prinzip wie bei pickRandomQuote(): ein gemeinsamer, gleich
    // gewichteter Pool statt 50/50-Split zwischen eigenen und Standardtexten.
    return list[Math.floor(Math.random() * list.length)].text;
  }

  function personalBadge(genericKey, personalKey) {
    const name = (state.settings.userName || '').trim();
    return name ? t(personalKey, { name }) : t(genericKey);

  // Merkt sich pro Challenge+Tag die einmal gezogene Erfolgsmeldung, damit sie
  // beim erneuten Rendern (z.B. nach jedem Klick) nicht wechselt und Modal
  // sowie Kartenanzeige denselben Text zeigen.
  const dayCompletionCache = {};

  // Wird AUSSCHLIESSLICH vom Task-Klick-Handler aufgerufen, in dem Moment,
  // in dem eine Challenge für "heute" tatsächlich komplett wird — und zwar
  // VOR dem folgenden render(). Nur hier darf forcedDayQuoteId (gesetzt beim
  // Hinzufügen/Bearbeiten einer Meldung) verbraucht werden.
  //
  // Warum nicht direkt in getDayCompletionMessage()/pickRandomQuote()? Weil
  // render() für JEDE aktive Karte läuft, die heute schon fertig ist —
  // unabhängig davon, ob der Nutzer gerade wirklich etwas abgehakt hat oder
  // nur z.B. die Einstellungen geschlossen oder eine andere Karte auf-/
  // zugeklappt hat. Lag eine erzwungene Meldung an, konnte davor jede
  // beliebige andere schon-fertige Karte, die einfach zufällig zuerst einen
  // fehlenden Cache-Eintrag füllte, die Markierung "wegschnappen" — die
  // eigentlich gemeinte Karte bekam dann wieder eine normale Zufallsmeldung.
  // Das erklärte das unzuverlässige Verhalten ("mal beim 1., mal erst beim
  // 2./3. Mal").
  function drawDayCompletionMessage(c, dateStr) {
    const key = c.id + '_' + dateStr;
    if (dayCompletionCache[key]) return dayCompletionCache[key];
    let quoteText = null;
    const forcedId = state.settings.forcedDayQuoteId;
    if (forcedId) {
      state.settings.forcedDayQuoteId = null;
      persist();
      const forced = getQuotes(state.settings.lang).find(q => q.id === forcedId);
      if (forced) quoteText = forced.text;
    }
    if (quoteText === null) quoteText = pickRandomQuote(state.settings.lang);
    dayCompletionCache[key] = {
      badge: personalBadge('quote_modal_badge', 'quote_modal_badge_personal'),
      quote: quoteText
    };
    return dayCompletionCache[key];
  }

  // Reiner Lese-/Fallback-Pfad für die Anzeige (Karten-Badge, Modal-Lookup).
  // Zieht bei fehlendem Cache-Eintrag IMMER normal zufällig — z.B. wenn nach
  // einem Reload eine bereits fertige Karte zum ersten Mal in dieser Session
  // gerendert wird. Verbraucht NIE forcedDayQuoteId (siehe
  // drawDayCompletionMessage() oben).
  function getDayCompletionMessage(c, dateStr) {
    const key = c.id + '_' + dateStr;
    if (!dayCompletionCache[key]) {
      dayCompletionCache[key] = {
        badge: personalBadge('quote_modal_badge', 'quote_modal_badge_personal'),
        quote: pickRandomQuote(state.settings.lang)
      };
    }
    return dayCompletionCache[key];
  }
